<style>

.scroll{overflow-x:auto}

.subj{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:6px}

<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== PENGATURAN: isi dua nilai ini dari Supabase (Project Settings > API) ===== */
const SUPABASE_URL="ISI_URL_PROYEK_SUPABASE";
const SUPABASE_ANON_KEY="ISI_ANON_PUBLIC_KEY";
/* ================================================================================ */
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

/* Lapisan penyimpanan: dokumen bersama + berkas video, berbasis Supabase */
let _base=null,_ver=0,_subs=[],_timer=null;
const _eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b),_isO=v=>v&&typeof v==="object"&&!Array.isArray(v);
function _merge(b,m,t){
  if(_eq(b,m))return t;
  if(_eq(m,t))return m;
  if(_isO(m)&&_isO(t)&&(_isO(b)||b===undefined)){
    const o={},B=b||{};
    new Set([...Object.keys(m),...Object.keys(B),...Object.keys(t)]).forEach(k=>{const v=_merge(B[k],m[k],t[k]);if(v!==undefined)o[k]=v});
    return o;
  }
  if(Array.isArray(m)&&Array.isArray(t)&&(Array.isArray(b)||b===undefined)){
    const B=(b||[]).map(x=>JSON.stringify(x)),M=m.map(x=>JSON.stringify(x));
    const removed=new Set(B.filter(x=>!M.includes(x))),added=M.filter(x=>!B.includes(x));
    const out=t.map(x=>JSON.stringify(x)).filter(x=>!removed.has(x));
    added.forEach(x=>{if(!out.includes(x))out.push(x)});
    return out.map(x=>JSON.parse(x));
  }
  return m;
}
const _snap=(path,row)=>({id:path.split("/").pop(),exists:!!row,data:()=>row?row.data:undefined});
async function _fetchState(){const {data,error}=await sb.from("docs").select("data,version").eq("path","app/state").maybeSingle();if(error)throw error;return data}
function _emit(state){_subs.forEach(cb=>{try{cb({id:"state",exists:true,data:()=>({json:JSON.stringify(state)})})}catch(e){}})}
async function _poll(){try{const row=await _fetchState();if(row&&row.version!==_ver){_ver=row.version;_base=JSON.parse(row.data.json);_emit(_base)}}catch(e){}}
async function _writeState(d){
  const mine=JSON.parse(d.json);
  for(let i=0;i<6;i++){
    const row=await _fetchState();
    if(!row){const {error}=await sb.from("docs").insert({path:"app/state",data:{json:JSON.stringify(mine)},version:1});if(!error){_base=mine;_ver=1;_emit(mine);return}continue}
    const merged=_merge(_base||{},mine,JSON.parse(row.data.json));
    const {data,error}=await sb.from("docs").update({data:{json:JSON.stringify(merged)},version:row.version+1}).eq("path","app/state").eq("version",row.version).select("version");
    if(!error&&data&&data.length){_base=merged;_ver=row.version+1;_emit(merged);return}
  }
  throw new Error("konflik");
}
const _db={doc(path){return{
  async get(){const {data,error}=await sb.from("docs").select("data").eq("path",path).maybeSingle();if(error)throw error;return _snap(path,data)},
  async set(d){if(path==="app/state")return _writeState(d);const {error}=await sb.from("docs").upsert({path,data:d});if(error)throw error},
  async delete(){const {error}=await sb.from("docs").delete().eq("path",path);if(error)throw error},
  onSnapshot(cb,err){
    if(path!=="app/state")return()=>{};
    _subs.push(cb);
    (async()=>{try{const row=await _fetchState();if(row){_ver=row.version;_base=JSON.parse(row.data.json);cb({id:"state",exists:true,data:()=>row.data})}else cb({id:"state",exists:false,data:()=>undefined})}catch(e){err&&err(e)}})();
    if(!_timer)_timer=setInterval(_poll,4000);
    return()=>{_subs=_subs.filter(x=>x!==cb)};
  }
}}};
const _assets={
  async upload(f,o){
    const ext=((f.name.split(".").pop()||"mp4").toLowerCase().replace(/[^a-z0-9]/g,""))||"mp4",id=crypto.randomUUID()+"."+ext;
    const {error}=await sb.storage.from("videos").upload(id,f,{contentType:(o&&o.type)||f.type||"video/mp4",upsert:false});
    if(error){const e=new Error(error.message);e.code=/size|exceed|too large|payload/i.test(error.message)?"too_large":/permission|policy|row-level|not allowed|unauthorized/i.test(error.message)?"not_granted":"error";throw e}
    return {id,url:sb.storage.from("videos").getPublicUrl(id).data.publicUrl};
  },
  async delete(id){await sb.storage.from("videos").remove([id])}
};
window.claude={use:async n=>n==="db"?_db:(n==="assets"&&typeof role!=="undefined"&&role==="guru")?_assets:null};
</script>

 k:[{q:"Nilai x dari 2x − 6 = 10 adalah …",o:["2","8","16"],k:1},{q:"Bentuk sederhana dari 5y + 2y − 3 adalah …",o:["7y − 3","10y − 3","7y + 3"],k:0}]},
{t:"Perbandingan",i:"Perbandingan membandingkan dua besaran, ditulis a : b. Pada perbandingan senilai, jika satu besaran naik maka besaran lain ikut naik. Pada perbandingan berbalik nilai, jika satu naik maka yang lain turun.",
 p:["Sederhanakan perbandingan dengan membagi kedua bilangan dengan FPB-nya.","Senilai: a₁/b₁ = a₂/b₂ (kalikan silang).","Berbalik nilai: a₁ × b₁ = a₂ × b₂.","Skala = jarak pada peta : jarak sebenarnya."],
 c:[{q:"5 buku harganya Rp40.000. Berapa harga 8 buku?",a:"Harga 1 buku = 40.000 ÷ 5 = 8.000. Harga 8 buku = 8 × 8.000 = Rp64.000."},{q:"6 pekerja menyelesaikan pekerjaan dalam 12 hari. Jika ada 9 pekerja, berapa hari?",a:"Berbalik nilai: 6 × 12 = 9 × h, maka h = 72 ÷ 9 = 8 hari."}],
 k:[{q:"Bentuk sederhana dari 24 : 36 adalah …",o:["2 : 3","3 : 4","4 : 5"],k:0},{q:"Skala peta 1 : 500.000. Jarak di peta 4 cm, jarak sebenarnya adalah …",o:["2 km","20 km","200 km"],k:1}]},

{t:"Statistik",i:"Statistik membantu kita mengumpulkan, menyajikan, dan menafsirkan data. Tiga ukuran pemusatan data yang paling sering dipakai adalah rata-rata, median, dan modus.",

const asMsg=x=>{const c=x&&x.code;return c==="not_granted"?"Akun ini belum diizinkan mengunggah (perlu akses Editor atau Contributor).":c==="unsupported_type"?"Format video tidak didukung. Gunakan mp4.":c==="too_large"?"Ukuran video melebihi batas penyimpanan Supabase (cek pengaturan bucket).":c==="store_unavailable"?"Penyimpanan sedang sibuk, coba lagi sebentar lagi.":c==="quota_exceeded"?"Kuota penyimpanan halaman penuh. Hapus video lama.":"Gagal mengunggah"+(c?" (kode: "+c+")":x&&x.message?": "+x.message:"")+"."};

const shrink=f=>new Promise((res,rej)=>{
  const r=new FileReader();r.onerror=()=>rej(new Error("baca"));
  r.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error("gambar"));
    im.onload=()=>{let sc=Math.min(1,1000/Math.max(im.width,im.height)),q=0.7,out="";const c=document.createElement("canvas");
      for(let i=0;i<7;i++){c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));c.getContext("2d").drawImage(im,0,0,c.width,c.height);out=c.toDataURL("image/jpeg",q);if(out.length<170000)break;sc*=0.8;q=Math.max(0.45,q-0.06)}
      out.length<200000?res(out):rej(new Error("besar"))};
    im.src=r.result};
  r.readAsDataURL(f);
});

async function loadProfiles(){
  const {data}=await sb.from("profiles").select("id,username,role,nama,lvl,rombel,av");
  const keep=PR[role+":"+me]||{};PR={};SISWA=[];
  (data||[]).forEach(p=>{PR[p.role+":"+p.username]={nama:p.nama,lvl:p.lvl,kelas:p.rombel,av:p.av||0};if(p.role==="siswa")SISWA.push(p.username)});
  SISWA.sort((a,b)=>(PR["siswa:"+a].nama||a).localeCompare(PR["siswa:"+b].nama||b));
  const c=await sb.from("contacts").select("email,hp").eq("id",UID).maybeSingle();
  const k=role+":"+me;PR[k]=Object.assign({},PR[k],{email:keep.email,hp:keep.hp},c.data||{});
}
async function setProf(p){
  const row={};if("nama"in p)row.nama=p.nama;if("lvl"in p)row.lvl=p.lvl;if("kelas"in p)row.rombel=p.kelas;if("av"in p)row.av=p.av;
  if(Object.keys(row).length){const {error}=await sb.from("profiles").update(row).eq("id",UID);if(error){toast("Gagal menyimpan profil.");return false}}
  if("email"in p||"hp"in p){const {error}=await sb.from("contacts").upsert({id:UID,email:p.email||"",hp:p.hp||""});if(error){toast("Gagal menyimpan kontak.");return false}}
  PR[ukey()]=Object.assign({},PR[ukey()],p);return true;
}
let _profTimer=null;
async function enter(user){
  const {data:p}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
  if(!p){await sb.auth.signOut();return false}
  UID=user.id;role=p.role;me=p.username;
  await loadProfiles();
  gk=role==="siswa"?(p.lvl||"7"):"7";page=role==="guru"?"progres":"home";
  await initDb();
  try{AS=await claude.use("assets");asErr=AS?"":"hanya untuk akun guru"}catch(e){AS=null;asErr=(e&&(e.code||e.message))||"error"}
  if(!_profTimer)_profTimer=setInterval(()=>{if(me)loadProfiles()},30000);
  return true;
}
async function boot(){
  if(/^ISI_/.test(SUPABASE_URL)){$("root").innerHTML='<div class="app"><div class="box" style="margin-top:20px"><h1>Belum dikonfigurasi</h1><p>Isi SUPABASE_URL dan SUPABASE_ANON_KEY di bagian atas file index.html, lalu muat ulang halaman. Langkah lengkap ada di README.md.</p></div></div>';return}
  try{const {data}=await sb.auth.getSession();if(data.session)await enter(data.session.user)}catch(e){}
  render();
}
boot();
</script>
